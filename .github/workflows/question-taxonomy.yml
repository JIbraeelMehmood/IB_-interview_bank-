name: Question taxonomy and filters

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/technology-experience-recommendations]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
